description: 'One Medical (1Life Healthcare, Inc.) is a membership-based primary care
  organization delivering in-person and virtual healthcare across 25+ US cities. Members
  pay an annual fee for same/next-day appointments, 24/7 on-demand video visits, secure
  provider messaging, integrated lab services, and digital health records, with most
  major insurance plans accepted. The company was surfaced as a portfolio company of
  GV (Google Ventures) and is now owned by Amazon, which offers One Medical membership
  to Amazon Prime members. This profile was added to the API Evangelist network as a
  stub for enrichment; One Medical operates a consumer healthcare site and member app
  and publishes no public developer API, developer portal, or /.well-known/ discovery
  surface.'
